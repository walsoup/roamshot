org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Polaroam build switches. Override in local.properties or with -P.
# Empty values use the pinned open models in ModelConfig.kt:
# Qwen3-0.6B (.litertlm, Apache-2.0) for quests and CLIP ViT-B/32 (.onnx, MIT) for photo checks.
# polaroam.modelUrl must be an https URL to a LiteRT-LM .litertlm bundle.
polaroam.modelUrl=
polaroam.modelSha256=
# polaroam.visionModelUrl must be an https URL to a CLIP ViT-B/32 image encoder in ONNX format.
polaroam.visionModelUrl=
polaroam.visionModelSha256=
# true = canned quest generator + stub verifier everywhere (handy on emulators without a camera model).
polaroam.stubAi=false
