org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Polaroam build switches. Override in local.properties or with -P.
# polaroam.modelUrl must be an https URL to a MediaPipe .task bundle (e.g. Gemma 3 1B IT int4).
polaroam.modelUrl=
polaroam.modelSha256=
# true = canned quest generator + stub verifier everywhere (handy on emulators without a camera model).
polaroam.stubAi=false
